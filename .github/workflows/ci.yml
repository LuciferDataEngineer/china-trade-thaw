name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: C++ headers for the comparison model
        run: sudo apt-get update && sudo apt-get install -y g++ python3-dev
      - run: pip install -r requirements-dev.txt
      - run: make lint
      - run: make test

  lakehouse:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ducklake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ducklake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_VOLUMES: /data
        ports:
          - 9000:9000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lake on the service containers
        env:
          LAKE_PG_HOST: 127.0.0.1
          LAKE_PG_PORT: "5432"
          LAKE_S3_ENDPOINT: http://127.0.0.1:9000
        run: python -m pytest -m lake -k service
      - name: Lake via testcontainers
        run: python -m pytest -m lake -k testcontainers

  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: C++ headers for the comparison model
        run: sudo apt-get update && sudo apt-get install -y g++ python3-dev
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: make pipeline
      - run: make e2e
