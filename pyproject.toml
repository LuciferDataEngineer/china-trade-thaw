[project]
name = "china-trade-thaw"
version = "1.0.0"
description = "How exposed are Australian goods exports to China, and what came back after 2020."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "lake: Postgres catalog and object store",
    "e2e: browser checks of the briefing",
]
filterwarnings = ["ignore::UserWarning"]
